[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "FridyER", email = "fridruronona@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "bcrypt>=4.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "psycopg2-binary>=2.9",
    "pydantic>=2.7",
    "pyjwt>=2.8",
    "pytest>=8",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.scripts]
repl-nix-workspace = "repl_nix_workspace:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
