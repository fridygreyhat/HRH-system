services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: hrh_user
      POSTGRES_PASSWORD: hrh_password
      POSTGRES_DB: hrh_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrh_user -d hrh_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    ports:
      - "8001:8000"
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg2://hrh_user:hrh_password@db:5432/hrh_db
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-change-me-0123456789}
      APP_TIMEZONE: Africa/Dar_es_Salaam
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      FORWARDED_ALLOW_IPS: "*"
      SMS_GATEWAY_TYPE: ${SMS_GATEWAY_TYPE:-mock}
      # Development only: show SMS confirmation codes on screen when no SMS gateway is configured.
      EXPOSE_DEV_OTP: ${EXPOSE_DEV_OTP:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "backend.worker"]
    environment: *backend_env
    volumes:
      - uploads:/data/uploads
    depends_on:
      backend:
        condition: service_healthy

  # One URL for the whole system: http://localhost:3000 serves the app and proxies /api to the backend.
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  # Development only: React dev server with hot reload on http://localhost:3001 (calls the API on :8001).
  #   docker compose --profile dev up -d frontend-dev
  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      target: dev
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      REACT_APP_API_URL: http://localhost:8001
      WATCHPACK_POLLING: "true"
      WDS_SOCKET_PORT: "3001"
      BROWSER: none
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
