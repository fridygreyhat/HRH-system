# Sign-in attempts per client address: slows password guessing across many accounts (the API also locks an account
# after repeated failures). Generous enough for many users behind one shared address (an office or a tunnel).
limit_req_zone $binary_remote_addr zone=signin:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 12m;   # payment proofs are capped at 10 MB by the API
    server_tokens off;          # do not reveal the nginx version

    include /etc/nginx/security-headers.conf;

    # API (FastAPI) under /api on the same origin: no CORS, one URL for users.
    # Resolve "backend" per request through Docker's DNS: a recreated backend container gets a new IP,
    # and a name resolved once at startup would leave /api timing out (504) until nginx restarts.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The connecting address only: a client-supplied X-Forwarded-For is not passed on.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /api/auth/login {
        limit_req zone=signin burst=20 nodelay;
        limit_req_status 429;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Progressive web app manifest (the service worker, /sw.js, is served by "location /" below with no-cache).
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }
}
