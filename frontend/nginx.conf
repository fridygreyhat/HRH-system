# Sign-in attempts per client address: slows password guessing across many accounts (the API also locks an account
# after repeated failures). Generous enough for many users behind one shared address (an office or a tunnel).
limit_req_zone $binary_remote_addr zone=signin:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 12m;   # payment proofs are capped at 10 MB by the API
    server_tokens off;          # do not reveal the nginx version

    include /etc/nginx/security-headers.conf;

    # API (FastAPI) under /api on the same origin: no CORS, one URL for users.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The connecting address only: a client-supplied X-Forwarded-For is not passed on.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /api/auth/login {
        limit_req zone=signin burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Interactive API docs at /api/docs load the schema from /openapi.json (only when ENABLE_API_DOCS=true).
    location = /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Installable web app: the manifest needs its own type; the offline worker must always be checked for updates.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }
}
