# Security headers for every response. Included in each location that sets its own add_header, because nginx drops
# the server-level add_header lines in any location that declares one.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
# Browsers ignore this over plain HTTP; behind an HTTPS front (tunnel, load balancer) it keeps users on HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
# Only this site's own scripts, styles, fonts and API. Inline style attributes are used by React; inline scripts are not.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
